name: CI

on:
  push:
  pull_request:

jobs:
  php:
    name: PHPUnit and Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, intl
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

  e2e:
    name: Two-browser end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sqlite3, mbstring, intl, pcntl
          coverage: none

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Prepare app
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          npm run build

      - name: Start app and Reverb
        run: |
          php artisan reverb:start > storage/logs/reverb.log 2>&1 &
          php artisan serve > storage/logs/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000 > /dev/null && exit 0; sleep 1; done
          echo "App did not start" && cat storage/logs/serve.log && exit 1

      - name: Run end-to-end test
        env:
          E2E_BROWSER: chrome
        run: npm run test:e2e

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: |
            storage/e2e/
            storage/logs/
